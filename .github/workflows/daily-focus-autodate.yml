name: Daily Focus Auto-Date

on:
  schedule:
    # Every Sunday at 09:00 UTC (05:00 ET during EDT, 04:00 ET during EST)
    # Creates all seven Daily Focus entries for the coming Monday-Sunday week
    - cron: "0 9 * * 0"
  workflow_dispatch:

jobs:
  update-date:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create next week's Daily Focus entries
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python daily_focus_autodate.py
